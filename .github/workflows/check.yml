name: Check
on:
  push: { branches: [main] }
  pull_request:
jobs:
  skill:
    name: Skill (Agent Skills spec, installer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Validate against the Agent Skills reference
        run: |
          pip install -q skills-ref
          agentskills validate skills/app-map
      - name: Install into a fresh repo
        run: |
          git init -q /tmp/sample && ./install.sh --repo /tmp/sample
          test -f /tmp/sample/.agents/skills/app-map/SKILL.md
          test -f /tmp/sample/.claude/skills/app-map/SKILL.md
          test -f /tmp/sample/.cursor/skills/app-map/SKILL.md
          test -f /tmp/sample/.cursor/rules/app-map.mdc
          /tmp/sample/.agents/skills/app-map/scripts/app-map | head -3
      - name: Automatic mode (twice, so the rule isn't duplicated)
        run: |
          git init -q /tmp/auto && ./install.sh --repo /tmp/auto --auto --map docs/map && ./install.sh --repo /tmp/auto --auto --map docs/map
          test "$(grep -c 'app-map:start' /tmp/auto/AGENTS.md)" = 1
          test "$(grep -c 'app-map:start' /tmp/auto/CLAUDE.md)" = 1
          grep -q '^  MAP_DIR: docs/map$' /tmp/auto/.github/workflows/app-map-update.yml
          ./install.sh --repo /tmp/auto --auto --map docs/map --agent gemini && grep -q "^  AGENT: gemini$" /tmp/auto/.github/workflows/app-map-update.yml
          pip install -q pyyaml && python3 -c "import yaml,sys; [yaml.safe_load(open(f)) for f in sys.argv[1:]]" /tmp/auto/.github/workflows/*.yml

  example:
    name: Example (build + verify ${{ matrix.map }} on a clean machine)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - map: wonderous
            src: wonderous-src
            repo: https://github.com/gskinnerTeam/flutter-wonderous-app
            dart: true
          - map: netnewswire
            src: netnewswire-src
            repo: https://github.com/Ranchero-Software/NetNewsWire
            dart: false
          - map: now-in-android
            src: now-in-android-src
            repo: https://github.com/android/nowinandroid
            dart: false
          - map: wikipedia-ios
            src: wikipedia-ios-src
            repo: https://github.com/wikimedia/wikipedia-ios
            dart: false
          - map: flutter-gallery
            src: flutter-gallery-src
            repo: https://github.com/flutter/gallery
            dart: true
          - map: wikipedia-android
            src: wikipedia-android-src
            repo: https://github.com/wikimedia/apps-android-wikipedia
            dart: false
    steps:
      - uses: actions/checkout@v4
      - name: The app the example maps, at the commit it was synced to
        run: |
          commit=$(python3 -c "import json; print(json.load(open('examples/${{ matrix.map }}/app-map.json'))['synced']['commit'])")
          git clone -q ${{ matrix.repo }} examples/${{ matrix.map }}/${{ matrix.src }}
          git -C examples/${{ matrix.map }}/${{ matrix.src }} checkout -q "$commit"
      - uses: dart-lang/setup-dart@v1
        if: matrix.dart
      - uses: browser-actions/setup-chrome@v1
      - name: Build the map
        run: skills/app-map/scripts/app-map build examples/${{ matrix.map }}
      - name: Verify every page (renders in headless Chrome, every name exists)
        run: skills/app-map/scripts/app-map verify examples/${{ matrix.map }}
      - name: The committed pages are what the sources build
        run: git diff --exit-code -- examples/${{ matrix.map }} ':!examples/${{ matrix.map }}/${{ matrix.src }}'
